name: Android
on:
  push:
    branches: [main]
    paths: ['android/**']
  pull_request:
    paths: ['android/**']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK (staat al op de runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
        working-directory: .
      - run: ./gradlew :core:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sticksense-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
